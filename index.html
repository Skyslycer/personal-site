<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <title>Skyslycer</title>

    <style>
      :root {
        color-scheme: light dark;
        --background: #f3fcff;
        --text: #071722;
        --muted: #496470;
        --accent: #007d8a;
        --accent-hover: #5f5ac8;
        --portrait: #d8f8fb;
        --portrait-border: #8deef4;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #070c14;
          --text: #ecfcff;
          --muted: #9bb5be;
          --accent: #00f0ff;
          --accent-hover: #9e9cff;
          --portrait: #12232d;
          --portrait-border: #257383;
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--background);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background: var(--background);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: 1rem;
        line-height: 1.7;
        text-rendering: optimizeLegibility;
      }

      main {
        width: min(100% - 2.5rem, 45rem);
        min-height: 100vh;
        margin-inline: auto;
        display: grid;
        place-items: center;
        padding-block: 4rem;
      }

      .intro {
        display: grid;
        grid-template-columns: 7.5rem minmax(0, 1fr);
        align-items: start;
        gap: 2.5rem;
      }

      .portrait {
        width: 7.5rem;
        aspect-ratio: 1;
        border: 1px solid var(--portrait-border);
        border-radius: 50%;
        background-color: var(--portrait);
        background-image: url("./profile.webp");
        background-position: center;
        background-size: cover;
      }

      h1,
      h2,
      p {
        margin-block-start: 0;
      }

      h1 {
        margin-block-end: 0.75rem;
        font-size: clamp(2rem, 6vw, 2.75rem);
        font-weight: 650;
        line-height: 1.15;
        letter-spacing: 0;
      }

      p {
        max-width: 35rem;
        margin-block-end: 0.65rem;
        color: var(--muted);
      }

      nav {
        margin-block-start: 2.25rem;
      }

      h2 {
        margin-block-end: 0.45rem;
        font-size: 0.95rem;
        font-weight: 650;
        letter-spacing: 0;
      }

      ul {
        display: flex;
        flex-wrap: wrap;
        gap: 0;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li:not(:last-child)::after {
        margin-inline: 0.55rem;
        color: var(--muted);
        content: "-";
      }

      a {
        color: var(--accent);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.2em;
      }

      a:hover,
      a:focus-visible {
        color: var(--accent-hover);
      }

      a:focus-visible {
        border-radius: 2px;
        outline: 2px solid currentColor;
        outline-offset: 4px;
      }

      @media (max-width: 35rem) {
        main {
          width: min(100% - 2rem, 30rem);
          place-items: center;
          padding-block: 3rem;
        }

        .intro {
          grid-template-columns: 1fr;
          gap: 1.75rem;
        }

        .portrait {
          width: 6.25rem;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <section class="intro" aria-labelledby="intro-heading">
        <div class="portrait" role="img" aria-label="Profile picture of Skyslycer"></div>
        <div>
          <h1 id="intro-heading">Hi, I'm Sky!</h1>
          <p>This is my little corner of the internet.</p>
          <p>
            I like computers, microcontrollers, and 3D printers and spend most
            of my time programming embedded or full-stack applications.
          </p>
          <nav aria-labelledby="elsewhere-heading">
            <h2 id="elsewhere-heading">Elsewhere</h2>
            <ul>
              <li><a href="https://github.com/Skyslycer">GitHub</a></li>
              <li><a href="https://discordapp.com/users/650070407503937536">Discord</a></li>
              <li><a href="https://bsky.app/profile/skyslycer.bsky.social">BlueSky</a></li>
              <li><a href="mailto:hello@skyslycer.de">E-Mail</a></li>
            </ul>
          </nav>
        </div>
      </section>
    </main>
  </body>
</html>
